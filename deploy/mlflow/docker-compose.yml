services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mlflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${B2_APPLICATION_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${B2_APPLICATION_KEY}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SERVER_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      B2_BUCKET_NAME: ${B2_BUCKET_NAME}
      MLFLOW_ADMIN_USERNAME: ${MLFLOW_ADMIN_USERNAME}
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD}
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_DOMAIN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        check_hex_secret() {
          case "$$2" in
            "") echo "FATAL: $$1 is empty." >&2; exit 1 ;;
            change-me|*openssl-rand*) echo "FATAL: $$1 is still a placeholder value from .env.example." >&2; exit 1 ;;
          esac
          case "$$2" in
            *[!0-9a-fA-F]*) echo "FATAL: $$1 contains non-hex characters, which can break shell/URL parsing (regenerate with: openssl rand -hex 24)." >&2; exit 1 ;;
          esac
        }
        check_hex_secret POSTGRES_PASSWORD "$$POSTGRES_PASSWORD"
        check_hex_secret MLFLOW_ADMIN_PASSWORD "$$MLFLOW_ADMIN_PASSWORD"
        check_hex_secret MLFLOW_FLASK_SERVER_SECRET_KEY "$$MLFLOW_FLASK_SERVER_SECRET_KEY"

        pip install --no-cache-dir psycopg2-binary boto3 Flask-WTF

        cat > /tmp/basic_auth.ini <<CONF
        [mlflow]
        default_permission = READ
        grant_default_workspace_access = true
        database_uri = postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres:5432/$$POSTGRES_DB
        admin_username = $$MLFLOW_ADMIN_USERNAME
        admin_password = $$MLFLOW_ADMIN_PASSWORD
        authorization_function = mlflow.server.auth:authenticate_request_basic_auth
        CONF

        export MLFLOW_AUTH_CONFIG_PATH=/tmp/basic_auth.ini
        exec mlflow server \
          --app-name basic-auth \
          --backend-store-uri "postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres:5432/$$POSTGRES_DB" \
          --default-artifact-root "s3://$$B2_BUCKET_NAME/mlflow-artifacts" \
          --host 0.0.0.0 \
          --port 5000

volumes:
  mlflow-postgres-data:
