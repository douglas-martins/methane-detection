services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    # 35d, not the 15d default: the detection-rate alert compares a recent
    # window against a 30-day rolling baseline via a PromQL subquery -- the
    # default retention would silently truncate that baseline window to 15
    # days without ever erroring.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=35d"
    volumes:
      # Directory bind mount (prometheus/ containing only prometheus.yml),
      # not a file-to-file mount -- Coolify has a currently-open bug where
      # a FILE bind-mount source that hasn't been staged yet gets
      # auto-created as an empty directory instead of the actual file,
      # producing "not a directory: Are you trying to mount a directory
      # onto a file" at container start (coollabsio/coolify#6056; its own
      # documented is_directory: false workaround is itself ignored by the
      # affected versions). Directory-to-directory mounts are the reliably
      # working case, confirmed against the real prom/prometheus:v3.5.0
      # image -- /etc/prometheus/ contains only prometheus.yml, nothing
      # else this mount would shadow.
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set to a real secret -- see .env.example}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
      # Consumed by grafana/provisioning/alerting/contact-points.yml's own
      # $PUSHOVER_API_TOKEN/$PUSHOVER_USER_KEY substitution -- a SEPARATE
      # substitution pass Grafana itself runs against its container env at
      # provisioning-load time, distinct from Compose's ${...} substitution
      # (from this file's .env) that resolves these two lines below.
      PUSHOVER_API_TOKEN: ${PUSHOVER_API_TOKEN}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  prometheus-data:
  grafana-data:
