services:
  prometheus:
    # Built, not a plain `image:` + bind mount -- Coolify's `volumes:` bind
    # mounts do not sync files from the git checkout (confirmed against
    # Coolify's own docs: a bind-mount source is either an empty
    # `is_directory: true` placeholder or a literal inline `content:` block
    # written into the compose YAML, never a copy of the referenced repo
    # file). A directory-mount attempt confirmed this live: the mount
    # itself succeeded but arrived empty, and Prometheus crash-looped with
    # "open /etc/prometheus/prometheus.yml: no such file or directory".
    # prometheus/Dockerfile COPYs the real file in at build time instead --
    # one source of truth, no bind-mount/persistent-storage gap to hit.
    build: ./prometheus
    restart: unless-stopped
    # 35d, not the 15d default: the detection-rate alert compares a recent
    # window against a 30-day rolling baseline via a PromQL subquery -- the
    # default retention would silently truncate that baseline window to 15
    # days without ever erroring.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=35d"
    volumes:
      - prometheus-data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    # Built, not a plain `image:` + bind mount -- same reasoning as
    # prometheus's build above. grafana/Dockerfile COPYs the whole
    # provisioning/ tree in at build time.
    build: ./grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set to a real secret -- see .env.example}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
      # Consumed by grafana/provisioning/alerting/contact-points.yml's own
      # $PUSHOVER_API_TOKEN/$PUSHOVER_USER_KEY substitution -- a SEPARATE
      # substitution pass Grafana itself runs against its container env at
      # provisioning-load time, distinct from Compose's ${...} substitution
      # (from this file's .env) that resolves these two lines below.
      PUSHOVER_API_TOKEN: ${PUSHOVER_API_TOKEN}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY}
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  prometheus-data:
  grafana-data:
