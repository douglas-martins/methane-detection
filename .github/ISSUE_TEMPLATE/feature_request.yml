name: Feature request
description: Propose a change or addition to the pipeline, model, or docs.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or painful today that this would fix.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Sketch of how you'd implement it, if you have one. Doesn't need to be final.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Data layer (DVC, preprocessing)
        - Training / model architecture
        - Experiment tracking (MLflow)
        - CI/CD
        - Serving (BentoML)
        - Monitoring (Prometheus/Grafana)
        - Retraining loop (Prefect)
        - On-board / embedded deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them, if any.
    validations:
      required: false
