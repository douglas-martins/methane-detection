name: Scripts Tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/scripts-tests.yml"

permissions:
  contents: read

concurrency:
  group: scripts-tests-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run bats tests
        run: make test-scripts
