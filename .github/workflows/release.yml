name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Shared with the Tests workflow's push-to-main runs: both push commits
  # directly to main (badge commits there, the version bump here), so they
  # must be serialized -- run them side by side and whichever pushes second
  # hits a stale upstream ref and fails ("Upstream branch has changed").
  group: main-push-serial
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Semantic Version Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Publish GitHub Release
        uses: python-semantic-release/publish-action@v10.6.1
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
