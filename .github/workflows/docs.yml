name: Docs

# Builds the public MkDocs site (docs/, mkdocs.yml) and deploys it to GitHub
# Pages. Path-filtered to the docs source + its build config so unrelated
# code changes don't trigger a rebuild; workflow_dispatch is also available
# for a manual run (e.g. to confirm the very first deploy before relying on
# the auto-trigger, per docs-reorganization-plan.md Step 9.6).
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # GitHub's own recommended group for Pages deploys -- serialize rather
  # than cancel, so a push landing mid-deploy still gets its own full run
  # instead of silently dropping the update it was meant to publish.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Build site
        run: make docs-build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
