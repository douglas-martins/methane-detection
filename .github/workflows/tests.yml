name: Tests

on:
  pull_request:
    paths: &test-paths
      - "src/data/**"
      - "src/training/**"
      - "configs/training/**"
      - "vendor/starcop/**"
      - "tests/vendor_starcop/**"
      - "requirements/env-a-dev.txt"
      - "requirements/env-a-mlflow.txt"
      - "conftest.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/tests.yml"
  push:
    branches:
      - main
    paths: *test-paths

permissions:
  contents: read

concurrency:
  # Push-to-main runs share a group with the Release workflow, which also
  # pushes directly to main (the version-bump commit) -- serializing them
  # avoids "Upstream branch has changed" when both try to push at once.
  # cancel-in-progress must stay false for that shared group so Release
  # doesn't get cancelled out from under itself; PR runs keep their own
  # per-branch group with cancellation so stale pushes still get superseded.
  group: ${{ github.event_name == 'push' && 'main-push-serial' || format('tests-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  environment-a-tests:
    # starcop_aviris_data_prep.py imports torch 1.13.1 + rasterio + georeader
    # + spectral + mag1c at module level, so even a fully-mocked unit test
    # needs the complete Environment A stack installed just to import it.
    # Kept path-filtered above since this install is slow.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          # RELEASE_TOKEN (admin PAT, bypasses branch protection) is only
          # needed by the badge-commit push below -- authenticated there
          # explicitly, not persisted here where test/build steps and
          # third-party dependency installs could reach it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create Environment A venv (Python 3.10)
        run: uv venv --python 3.10 vendor/starcop/.venv

      - name: Install STARCOP + test dependencies
        # rasterio/GDAL usually resolve via prebuilt manylinux wheels on
        # ubuntu-latest. If this step fails on a GDAL build error, add:
        #   sudo apt-get update && sudo apt-get install -y libgdal-dev gdal-bin
        run: |
          uv pip install --python vendor/starcop/.venv/bin/python \
            -r vendor/starcop/requirements.txt \
            -r requirements/env-a-dev.txt
          uv pip install --python vendor/starcop/.venv/bin/python -e vendor/starcop

      - name: Install MLflow client dependencies
        # src/training/'s composition-seam modules (_vendor_starcop_training.py)
        # are the first thing in this repo's Environment A test suite to import
        # starcop.data.data_logger/datamodule, which pull in pytorch_lightning
        # and wandb -- requirements/env-a-mlflow.txt pins setuptools/numpy/protobuf
        # to versions those 2022-era packages actually still import under.
        run: |
          uv pip install --python vendor/starcop/.venv/bin/python \
            -r requirements/env-a-mlflow.txt

      - name: Run tests with coverage
        run: make coverage

      - name: Generate badges
        run: make badges

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-env-a
          path: |
            junit.xml
            coverage.xml

      - name: Commit updated badges
        if: github.event_name == 'push'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/badges/tests-env-a.svg docs/badges/coverage-env-a.svg
          git diff --cached --quiet || git commit -m "chore(badges): update test/coverage badges [skip ci]"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push

  environment-b-tests:
    # Covers src/data/preprocessing/__tests__ (the DVC pipeline stage scripts).
    # This is the project's main MLOps stack (torch>=2.5, rasterio,
    # georeader-spaceml, hydra-core, dvc) at the root pyproject.toml, not
    # STARCOP's original torch 1.13.1 environment -- see
    # src/data/preprocessing/_vendor_starcop.py for why it can still import
    # vendor/starcop's data modules directly without Environment A installed.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          # RELEASE_TOKEN (admin PAT, bypasses branch protection) is only
          # needed by the badge-commit push below -- authenticated there
          # explicitly, not persisted here where test/build steps and
          # third-party dependency installs could reach it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Environment B dependencies
        # rasterio/georeader-spaceml usually resolve via prebuilt manylinux
        # wheels on ubuntu-latest. If this step fails on a GDAL build error,
        # add: sudo apt-get update && sudo apt-get install -y libgdal-dev gdal-bin
        run: uv sync

      - name: Check docstring coverage
        run: make docstring-coverage

      - name: Run tests with coverage
        run: make coverage-env-b

      - name: Generate badges
        run: make badges-env-b

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-env-b
          path: |
            junit-env-b.xml
            coverage-env-b.xml

      - name: Commit updated badges
        if: github.event_name == 'push'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/badges/tests-env-b.svg docs/badges/coverage-env-b.svg
          git diff --cached --quiet || git commit -m "chore(badges): update env-b test/coverage badges [skip ci]"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
