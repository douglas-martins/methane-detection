# BentoML build config for the STARCOP baseline inference service.
# Build context is the project root so the bundle includes the relocated
# baseline adapter, shared drift/registry modules, and vendor/starcop source
# required when MLflow unpickles the model. BS-07 validated this closure with
# local Bento build, containerization, and HTTP smokes; deployment still requires
# an explicit workflow_dispatch.
service: "src.baselines.starcop.serving.service:MethaneDetectionService"

labels:
  owner: douglas-martins
  project: methane-detection

include:
  - "src/baselines/starcop/serving/*.py"
  - "src/serving/*.py"
  - "src/registry/mlflow_registry.py"
  - "vendor/starcop/starcop/**/*.py"

python:
  requirements_txt: "requirements/serving.txt"

docker:
  env:
    MODEL_NAME: "starcop-baseline-mag1c-rgb"
    MODEL_STAGE: "Staging"
