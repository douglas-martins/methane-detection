[project]
name = "methane-detection"
version = "0.6.0"
description = "MLOps pipeline for semantic segmentation of methane plumes on hyperspectral imagery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",
    "lightning>=2.3",
    "segmentation-models-pytorch",
    "georeader-spaceml",
    "rasterio",
    "kornia",
    "dvc[gdrive]",
    "mlflow",
    "hydra-core",
    "omegaconf",
    "wandb",
    "pytest",
    "pytest-cov",
    "bentoml",
    "prefect",
]

[dependency-groups]
dev = [
    "python-semantic-release>=9",
    "genbadge[tests,coverage]",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
]
omit = [
    "*/__tests__/*",
    "*/conftest.py",
    # Only starcop_aviris_data_prep.py is under test in this directory —
    # its untested siblings would otherwise drag the coverage % down.
    "*/scripts/preprocessing/aviris_as_sensor.py",
    "*/scripts/preprocessing/join_labels_permian.py",
    "*/scripts/preprocessing/mag1c.py",
    "*/scripts/preprocessing/process_data_jpl_4corners.py",
    "*/scripts/preprocessing/simulate_S2_from_aviris.py",
    "*/scripts/preprocessing/stats_mag1c.py",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''docs(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''Initial [Cc]ommit.*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"