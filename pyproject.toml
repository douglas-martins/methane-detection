[project]
name = "methane-detection"
version = "0.18.1"
description = "MLOps pipeline for semantic segmentation of methane plumes on hyperspectral imagery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",
    "lightning>=2.3",
    "segmentation-models-pytorch",
    "georeader-spaceml",
    "rasterio",
    "kornia",
    "dvc[gdrive]",
    "mlflow",
    "hydra-core",
    "omegaconf",
    "wandb",
    "pytest",
    "pytest-cov",
    "bentoml",
    "prefect",
    "boto3",
    "requests",
]

[dependency-groups]
dev = [
    "python-semantic-release>=9",
    "genbadge[tests,coverage]",
    "interrogate",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src", "tests", "flows"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
# vendor/starcop is a git submodule, composition-only -- never linted or
# reformatted, even by an autofix. See vendor-starcop-composition-only.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.interrogate]
# Test methods are intentionally undocumented project-wide -- their
# descriptive names (test_raises_when_uri_missing, ...) already read as the
# spec, so a docstring on top would just restate the name. Private/magic
# methods are exempted for the same reason: they're implementation detail
# the class docstring already covers.
exclude = ["*/__tests__/*", "vendor", ".venv"]
ignore-private = true
ignore-magic = true
ignore-nested-functions = true
fail-under = 80

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
]
omit = [
    "*/__tests__/*",
    "*/conftest.py",
    # Only starcop_aviris_data_prep.py is under test in this directory —
    # its untested siblings would otherwise drag the coverage % down.
    "*/scripts/preprocessing/aviris_as_sensor.py",
    "*/scripts/preprocessing/join_labels_permian.py",
    "*/scripts/preprocessing/mag1c.py",
    "*/scripts/preprocessing/process_data_jpl_4corners.py",
    "*/scripts/preprocessing/simulate_S2_from_aviris.py",
    "*/scripts/preprocessing/stats_mag1c.py",
    # A @hydra.main CLI entrypoint requiring a full ML pipeline run to
    # exercise -- can't run in a fast unit-test suite. Its actual logic
    # is delegated to already-tested helper modules (mlflow_utils.py,
    # settings_overlay.py, launch_profiles.py, etc.); this file itself
    # has always been 0% covered, not a regression from any one change.
    "*/training/train.py",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
allow_zero_version = true
# GitHub natively skips triggering new workflow runs for a push whose commit
# message contains [skip ci], anywhere in the message. Without this, the
# release commit's own push re-triggers Tests and Release on a commit that
# can never contain a version-bumping change (its type never parses as
# feat/fix), wasting a full CI run and racing Release against itself again.
commit_message = "{version}\n\nAutomatically generated by python-semantic-release [skip ci]"

# uv.lock pins this project's own version independently of pyproject.toml;
# without this, PSR's version bump leaves uv.lock stale and the next
# `uv sync` in CI silently rewrites it, leaving an unstaged diff behind.
build_command = """
    set -e
    python -m pip install uv
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""

[tool.semantic_release.remote]
# main is protected, so the git push needs the admin RELEASE_TOKEN PAT
# persisted by the workflow's checkout step, not the github_token above
# (kept as the narrower default GITHUB_TOKEN for the release action's API
# calls). Without this, PSR would overwrite the remote URL's credentials
# with github_token and the push would hit GH006 again.
ignore_token_for_push = true

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''docs(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''Initial [Cc]ommit.*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"