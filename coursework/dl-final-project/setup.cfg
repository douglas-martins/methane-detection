[mutmut]
# Standalone mutmut config, scoped to this folder only. mutmut reads config from the
# *current working directory* only (no --config flag) -- since there is no pyproject.toml
# here, it falls back to this file's [mutmut] section instead of the repo root's
# [tool.mutmut] in pyproject.toml. Run with cwd=coursework/dl-final-project so the two
# never interact; see .agents/rules/mutation-testing.md and the repo pyproject.toml's
# do_not_mutate, which exclude coursework/ from the repo-wide gate on purpose (this
# folder is deleted once the course is graded -- see the Makefile's coursework block).
source_paths = .
# --- Performance: read this before running mutmut on this project ---------
# `train.py`'s fit() mutates real loop-control code (early-stopping
# conditions, step/epoch counters) and generates many mutants that
# genuinely infinite-loop. Two compounding problems made this previously
# unusable (one real run: 58 SIGXCPU coredumps and crash-notification spam
# in 25 minutes, without finishing fit() alone):
#
# 1. mutmut's default timeout (multiplier=15.0, constant=1.0 -> ~15*baseline+1s
#    per hanging mutant, ~184s here) hedges against an unknown CI runner.
#    This is a known, stable, single machine, so tightened below -- still a
#    generous margin over the ~12s baseline, just not 3-minutes-per-hang
#    generous.
# 2. THE BIGGER ONE: mutmut's `max_children` defaults to `os.cpu_count()`
#    (12 here) parallel worker processes, and torch defaults to 6 internal
#    threads per process (unset OMP_NUM_THREADS/MKL_NUM_THREADS) -- 12
#    workers x 6 threads = 72 threads fighting over 12 real cores. That
#    oversubscription, not broken mutations, is why ~100% of fit() mutants
#    were hitting the timeout even after (1) was fixed alone (verified: one
#    run with only the timeout tightened still timed out on every checked
#    mutant; capping threads to 1 immediately after brought a ~97-mutant
#    fit() batch to 0 timeouts, all killed, in 26 seconds). This is the
#    exact same oversubscription class of bug already fixed once in this
#    project's own DataLoader `num_workers` config (see train.py's fit()
#    docstring) -- same lesson, one level up.
#
# CONSEQUENCE: always run mutmut here via `make coursework-mutation`
# (repo-root Makefile), which sets OMP_NUM_THREADS=1 and MKL_NUM_THREADS=1.
# Running `mutmut` directly without those two env vars set will reproduce
# the crash-spam and near-total-timeout behavior above.
timeout_multiplier = 3.0
timeout_constant = 5.0
also_copy =
    __tests__
    r2_manifest_train.csv
    r2_manifest_val.csv
only_mutate =
    early_stopping.py
    preprocessing.py
    sampling.py
    losses.py
    metrics.py
    pr_curve_plots.py
    architectures.py
    dataset.py
    eda.py
    evaluate.py
    train.py
    patch_cache.py
    precompute_patch_cache.py
do_not_mutate =
    __tests__/*
    confirm_raw.py
    build_r2_manifest.py
track_dependencies = False
pytest_add_cli_args_test_selection =
    __tests__/test_early_stopping.py
    __tests__/test_preprocessing.py
    __tests__/test_sampling.py
    __tests__/test_losses.py
    __tests__/test_metrics.py
    __tests__/test_pr_curve_plots.py
    __tests__/test_architectures.py
    __tests__/test_dataset.py
    __tests__/test_eda.py
    __tests__/test_evaluate.py
    __tests__/test_train.py
    __tests__/test_patch_cache.py
    __tests__/test_precompute_patch_cache.py
